<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Black plate: the tab strip may be light or dark, and the cube's faces
       are mid-greys that would sink into a dark one. The plate guarantees the
       same backdrop everywhere; the hairline keeps the icon's edge visible
       when the surrounding chrome is also near-black. -->
  <rect x="0.5" y="0.5" width="63" height="63" rx="12" fill="#000" stroke="#33333c"/>
  <!-- Same isometric cube as the hero and the nav mark, scaled to 44px tall
       and centred. Flat fills, not gradients: at a 16px tab size a gradient
       resolves to a single averaged tone and only costs bytes. The three
       faces are pushed further apart in value than the nav version so the
       form still reads when it is 16 pixels wide. -->
  <polygon points="32,10 51.25,21 32,32 12.75,21" fill="#b4b4c0"/>
  <polygon points="12.75,21 32,32 32,54 12.75,43" fill="#4a4a55"/>
  <polygon points="51.25,21 32,32 32,54 51.25,43" fill="#7d7d8a"/>
</svg>
